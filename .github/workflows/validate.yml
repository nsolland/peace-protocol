name: Validate PEACE

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Validate protocol surface
        run: python scripts/validate_publication.py

      - name: Parse JSON artifacts
        run: |
          python -m json.tool schemas/peace-envelope-v0.schema.json >/dev/null
          python -m json.tool conformance/conformance-v0.json >/dev/null
